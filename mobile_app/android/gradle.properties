org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Cloud runtime exposes many host CPUs; keep workers within its four-core quota.
org.gradle.workers.max=4
# Avoid per-user Kotlin daemon state in read-only home directories.
kotlin.compiler.execution.strategy=in-process

name: Publish bench test release
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/test-release.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-v1.0.1-test
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      RELEASE_TAG: v1.0.1-test
    steps:
      - name: Set writable tool directories
        shell: bash
        run: |
          echo "DRONE_TOOLS_ROOT=$RUNNER_TEMP/drone-tooling" >> "$GITHUB_ENV"
          echo "DRONE_TOOLING_ROOT=$RUNNER_TEMP/drone-tooling" >> "$GITHUB_ENV"
      - name: Check out exact tested source tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: v1.0.1-test
          path: source
          persist-credentials: false
      - name: Prepare Git-only status channel
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
          path: status
      - name: Initialize status reporter
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/status"
          branch="release-status/$RELEASE_TAG"
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch origin "$branch"
            git switch -C "$branch" FETCH_HEAD
          else
            git switch -c "$branch"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cat > "$RUNNER_TEMP/report-release.sh" <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE/status"
          export RELEASE_PHASE="$1"
          python3 - <<'PY'
          import json,os,pathlib,datetime
          report={'phase':os.environ['RELEASE_PHASE'],'tag':os.environ['RELEASE_TAG'],
                  'run_url':f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
                  'updated_utc':datetime.datetime.now(datetime.timezone.utc).isoformat()}
          result=pathlib.Path(os.environ['RUNNER_TEMP'])/'release-result.json'
          if result.exists(): report['release']=json.loads(result.read_text())
          pathlib.Path('release-status.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          git add release-status.json
          if ! git diff --cached --quiet; then
            git commit -m "Report $RELEASE_TAG: $RELEASE_PHASE"
            git push origin "HEAD:refs/heads/release-status/$RELEASE_TAG"
          fi
          SCRIPT
          chmod +x "$RUNNER_TEMP/report-release.sh"
          "$RUNNER_TEMP/report-release.sh" running
      - name: Install Flutter and Android tools
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/setup_flutter.sh
          "$RUNNER_TEMP/report-release.sh" android-tools-ready
      - name: Build Android debug APK
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          # Fresh Jetifier transforms exceed 2 GiB on a cold runner.
          # Override resource limits only; the tagged application stays unchanged.
          export GRADLE_OPTS='-Dorg.gradle.jvmargs=-Xmx4G -Dorg.gradle.workers.max=2'
          scripts/build_android.sh 2>&1 | tee "$RUNNER_TEMP/android-build.log"
          "$RUNNER_TEMP/report-release.sh" apk-built
      - name: Package exact tagged source and checksums
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release-assets"
          git archive --format=zip --prefix=ESP32-Drone/ --output="$RUNNER_TEMP/release-assets/ESP32-Drone-source-v1.0.1-test.zip" "$RELEASE_TAG"
          cp mobile_app/build/app/outputs/flutter-apk/app-debug.apk "$RUNNER_TEMP/release-assets/ESP32-Drone-Android-v1.0.1-test.apk"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum *.zip *.apk > SHA256SUMS.txt
      - name: Create test release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          assets="$RUNNER_TEMP/release-assets"
          cat > "$RUNNER_TEMP/release-notes.md" <<'NOTES'
          Flutter Android 1.0.1 / build 2, built from the exact fixed tag v1.0.1-test. Fixes dialog controller disposal causing _dependents.isEmpty, stale widget callbacks, WebSocket reconnect races and joystick callbacks after disposal.

          Flutter analyze is clean and 27 tests passed. The APK is universal and debug-signed. Firmware and hardware configuration are unchanged; do not reflash the ESP32 for this update. No physical phone/ESP32 validation is claimed.

          Assets: fixed Android APK, source ZIP from the exact tag, SHA256SUMS.txt. Uninstall the previous debug app if Android reports a signing conflict, then install this APK. Connect to the ESP32 AP at ws://192.168.4.1:81/ws with the firmware session token. Keep DISARMED while verifying connection.
          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title "$RELEASE_TAG — Flutter lifecycle fix" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          # Never silently replace existing release files. Failed/retried jobs stop on a conflicting asset.
          gh release upload "$RELEASE_TAG" "$assets/ESP32-Drone-Android-v1.0.1-test.apk" "$assets/ESP32-Drone-source-v1.0.1-test.zip" "$assets/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"
          # Draft releases may not resolve through the tag endpoint until published.
          release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$RELEASE_TAG\") | .id")"
          [[ "$release_id" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/releases/$release_id" > "$RUNNER_TEMP/release-result.json"
          python3 - <<'PY'
          import os,json,pathlib,hashlib
          release=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'release-result.json').read_text())
          remote={a['name']:a for a in release['assets']}
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'release-assets'
          for p in root.iterdir():
              a=remote.get(p.name)
              if not a or a['state']!='uploaded' or a['size']!=p.stat().st_size:
                  raise RuntimeError('Upload verification failed: '+p.name)
              digest=a.get('digest')
              if digest and digest!='sha256:'+hashlib.file_digest(p.open('rb'),'sha256').hexdigest():
                  raise RuntimeError('Remote digest mismatch: '+p.name)
          PY
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/release-result.json"
          "$RUNNER_TEMP/report-release.sh" uploaded-and-verified
      - name: Report failure without claiming upload success
        if: failure()
        shell: bash
        run: |
          if [[ -x "$RUNNER_TEMP/report-release.sh" ]]; then
            if [[ -f "$RUNNER_TEMP/android-build.log" ]]; then
              tail -n 160 "$RUNNER_TEMP/android-build.log" > "$GITHUB_WORKSPACE/status/release-build-error.log"
              git -C "$GITHUB_WORKSPACE/status" add -f release-build-error.log
            fi
            "$RUNNER_TEMP/report-release.sh" failed
          fi

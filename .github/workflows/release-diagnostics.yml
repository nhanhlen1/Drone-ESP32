name: Inspect release build failure
on:
  push:
    branches: [main]
    paths: [.github/workflows/release-diagnostics.yml]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed failed release run to inspect
        required: true
        default: '40488529021'
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: release-status/v1.0.0-test
      - name: Save failed build diagnostic for Git-only access
        env:
          GH_TOKEN: ${{ github.token }}
          INSPECT_RUN: ${{ inputs.run_id || '40488529021' }}
        shell: bash
        run: |
          set -euo pipefail
          gh run view "$INSPECT_RUN" --repo "$GITHUB_REPOSITORY" --log-failed | tail -n 250 > release-build-error.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add release-build-error.log
          if ! git diff --cached --quiet; then
            git commit -m "Record release build diagnostic for run $INSPECT_RUN"
            git push origin HEAD:refs/heads/release-status/v1.0.0-test
          fi

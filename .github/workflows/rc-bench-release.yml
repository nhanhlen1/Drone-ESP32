name: Publish Kotlin RC DISARMED bench
on:
  push:
    branches: [main]
    paths: [.github/workflows/rc-bench-release.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: rc-bench-v0.1.0-test
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RELEASE_TAG: rc-bench-v0.1.0-test
    steps:
      - name: Check out tested native project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: rc-bench-v0.1.0-test
          persist-credentials: false
      - name: Use installed JDK and Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android_rc_bench/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;35.0.0'
      - name: Test, lint and build native APK
        working-directory: android_rc_bench
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug
          python3 - <<'PY'
          import pathlib,xml.etree.ElementTree as E
          total=0
          for path in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root=E.parse(path).getroot()
              if any(int(root.attrib[k]) for k in ('failures','errors','skipped')):
                  raise RuntimeError('Failed or skipped tests: '+str(path))
              total+=int(root.attrib['tests'])
          if total!=47: raise RuntimeError(f'Expected 47 tests, got {total}')
          print(f'Confirmed {total} tests passed; no failures/skips')
          PY
      - name: Package APK and Android Studio source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rc-bench-assets"
          cp android_rc_bench/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/rc-bench-assets/ESP32-RC-Bench-v0.1.0-debug.apk"
          git archive --format=zip --prefix=ESP32-RC-Bench/ --output="$RUNNER_TEMP/rc-bench-assets/ESP32-RC-Bench-AndroidStudio-source.zip" "$RELEASE_TAG:android_rc_bench"
          cd "$RUNNER_TEMP/rc-bench-assets"
          sha256sum *.apk *.zip > SHA256SUMS.txt
      - name: Publish bench prerelease and verify uploaded assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/rc-bench-notes.md" <<'NOTES'
          Ứng dụng Android Kotlin độc lập cho ArduCopter qua TCP 192.168.4.1:5760 / MAVLink2. Package dev.drone.rcbench, cài cùng app Flutter cũ được.

          CHỈ kiểm tra RC khi DISARMED: SYS255/COMP190, target từ HEARTBEAT autopilot; hai joystick + deadman, RC1–RC4 và kiểm tra từng kênh, telemetry TX/RX riêng. Không có lệnh ARM, DISARM, Motor Test, SET_MODE hoặc thay tham số. Không flash/nạp lại ESP32.

          Giới hạn CH4 ở ±25% span mỗi phía trim (mặc định 1400–1600µs) vì ARMING_RUDDER chưa được xác minh. Trước thử phải tháo cánh và ngắt nguồn ESC. Chỉ biết trạng thái từ HEARTBEAT mới nhất, không thay thế inhibit phía firmware. RC_CHANNELS.chancount=0 hợp lệ với ArduPilot receiverless; PWM có thể còn cache sau timeout, không phải ACK hay bằng chứng override còn hoạt động.

          47 unit/loopback tests passed, lint0errors/2nonfatalwarnings, debugAPK built. Không thử điện thoại/ESP32/MissionPlanner thực trong cloud. README trong ZIP hướng dẫn Android Studio/Windows, hiệu chỉnh kênh và nghiệm thu timeout0.5s phía ArduPilot. Bản debug chưa đủ điều kiện bay.
          NOTES
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --title 'RC Bench v0.1.0 — Kotlin MAVLink2 DISARMED' --notes-file "$RUNNER_TEMP/rc-bench-notes.md"
          fi
          root="$RUNNER_TEMP/rc-bench-assets"
          gh release upload "$RELEASE_TAG" "$root/ESP32-RC-Bench-v0.1.0-debug.apk" "$root/ESP32-RC-Bench-AndroidStudio-source.zip" "$root/SHA256SUMS.txt" --repo "$GITHUB_REPOSITORY"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/rc-bench-release.json"
          python3 - <<'PY'
          import pathlib,os,json,hashlib
          r=json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'rc-bench-release.json').read_text())
          if r['draft']:raise RuntimeError('Release still draft')
          remote={a['name']:a for a in r['assets']}
          for p in (pathlib.Path(os.environ['RUNNER_TEMP'])/'rc-bench-assets').iterdir():
              a=remote.get(p.name)
              if not a or a['state']!='uploaded' or a['size']!=p.stat().st_size:raise RuntimeError('Asset upload incomplete: '+p.name)
              if a.get('digest')!='sha256:'+hashlib.file_digest(p.open('rb'),'sha256').hexdigest():raise RuntimeError('Asset checksum mismatch: '+p.name)
          print(r['html_url'])
          PY
